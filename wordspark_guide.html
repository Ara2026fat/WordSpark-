<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WordSpark · ابدأ رحلتك</title>
<meta name="description" content="تعلّم الإنجليزية ليس جمع كلمات — بل بناء نفسك مهارة بعد مهارة.">
<meta name="theme-color" content="#060B14">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=Tajawal:wght@400;500;700&family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">

<style>
/* ══════════════════════════════════════════════════════
   WordSpark — First Encounter
   Six screens, each one idea, none of them scrolling.
   The question this answers is "why would I start?" —
   not "how do I use it?".
   ══════════════════════════════════════════════════════ */

:root{
  --night:#060B14; --rail:#0E1A2B; --edge:rgba(148,180,220,.14);
  --gold:#F5C842; --ember:#FB923C; --teal:#2DD4BF; --violet:#A78BFA;
  --ink:#EAF1FA; --mist:#8FA3BE; --dim:#5A6E88;
  --ar-display:'Readex Pro',system-ui,sans-serif;
  --ar-body:'Tajawal',system-ui,sans-serif;
  --en:'Space Grotesk',system-ui,sans-serif;
  --mono:'Space Mono',ui-monospace,monospace;
  --deck:84px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:var(--night);color:var(--ink);font-family:var(--ar-body);
  line-height:1.7;
  background-image:
    radial-gradient(125% 55% at 50% 112%,rgba(251,146,60,.15),transparent 62%),
    radial-gradient(85% 45% at 8% -8%,rgba(45,212,191,.10),transparent 60%);
}
body.en{font-family:var(--en)}

/* ── CHROME ─────────────────────────────────────────── */
.top{
  position:fixed;top:0;inset-inline:0;z-index:60;
  display:flex;align-items:center;justify-content:space-between;padding:14px 18px;
}
.brand{font-family:var(--en);font-size:11px;letter-spacing:5px;color:var(--gold);
  font-weight:700;display:inline-flex;align-items:center;gap:8px}
.brand i{width:6px;height:6px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 12px var(--gold);font-style:normal}
.lang{display:flex;border:1px solid var(--edge);border-radius:9px;overflow:hidden;
  background:rgba(14,26,43,.7);backdrop-filter:blur(8px)}
.lang button{font-family:var(--en);font-size:10.5px;font-weight:700;letter-spacing:1px;
  background:none;border:0;color:var(--dim);padding:7px 12px;cursor:pointer;transition:.25s}
.lang button.on{background:linear-gradient(100deg,var(--gold),var(--ember));color:var(--night)}

/* ── SCREENS ────────────────────────────────────────── */
.deck{position:relative;height:100svh}
.scr{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:74px 22px var(--deck);max-width:620px;margin:0 auto;text-align:center;
  opacity:0;visibility:hidden;transform:translateY(26px) scale(.985);
  transition:opacity .55s cubic-bezier(.2,.7,.3,1),
             transform .55s cubic-bezier(.2,.7,.3,1),
             visibility .55s;
}
.scr.live{opacity:1;visibility:visible;transform:none}
.scr.past{transform:translateY(-26px) scale(.985)}

/* Children rise in sequence once the screen lands, so each idea
   arrives in reading order instead of all at once. */
.scr > *{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.3,1)}
.scr.live > *{opacity:1;transform:none}
.scr.live > *:nth-child(1){transition-delay:.12s}
.scr.live > *:nth-child(2){transition-delay:.22s}
.scr.live > *:nth-child(3){transition-delay:.32s}
.scr.live > *:nth-child(4){transition-delay:.42s}

.kicker{font-family:var(--en);font-size:10.5px;font-weight:700;letter-spacing:3.5px;
  text-transform:uppercase;color:var(--teal);margin-bottom:14px}
h1{font-family:var(--ar-display);font-weight:700;
  font-size:clamp(26px,7.4vw,46px);line-height:1.22;letter-spacing:-.5px;margin-bottom:14px}
body.en h1{font-family:var(--en);letter-spacing:-1.2px}
.say{font-size:clamp(14px,3.9vw,17.5px);color:#B9C9DE;max-width:44ch;margin:0 auto}
.spark-tx{background:linear-gradient(100deg,var(--gold),var(--ember));
  -webkit-background-clip:text;background-clip:text;color:transparent}

/* ── 1 · THE SPARK ──────────────────────────────────── */
.stage{height:96px;display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:6px}
.sp-w{font-family:var(--ar-display);font-size:clamp(26px,7.6vw,42px);font-weight:700;
  color:var(--mist);transition:opacity .4s,transform .4s}
.sp-w.en{font-family:var(--en);background:linear-gradient(100deg,var(--gold),var(--ember));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sp-w.out{opacity:0;transform:translateY(-9px)}
.sp-b{font-size:20px;color:var(--gold);filter:drop-shadow(0 0 12px rgba(245,200,66,.9));
  animation:flick 2.6s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:.5;transform:scale(1)}46%{opacity:1;transform:scale(1.22)}}

/* ── 2 · SKILL CONSTELLATION (the WOW) ──────────────
   Nine skills wired to one core. Rather than a feature list,
   the connections light up one by one — the reader watches a
   system assemble itself, which is the actual claim: these
   parts are not separate apps, they grow together. */
.const-wrap{width:100%;max-width:340px;margin-bottom:18px}
#constel{width:100%;height:auto;display:block;overflow:visible}
.cn-line{stroke:var(--edge);stroke-width:1;opacity:0;transition:opacity .5s,stroke .5s}
.cn-line.on{opacity:1;stroke:rgba(45,212,191,.5)}
.cn-node{opacity:0;transition:opacity .45s,transform .45s;transform-origin:center;transform-box:fill-box}
.cn-node.on{opacity:1}
.cn-dot{fill:var(--rail);stroke:var(--edge);stroke-width:1.2;transition:.45s}
.cn-node.on .cn-dot{fill:rgba(45,212,191,.16);stroke:var(--teal)}
.cn-tx{font-family:'Space Grotesk',sans-serif;font-size:7.4px;font-weight:700;
  fill:var(--mist);text-anchor:middle}
.cn-node.on .cn-tx{fill:var(--ink)}
.cn-core{fill:url(#coreG);filter:drop-shadow(0 0 10px rgba(245,200,66,.55))}
.cn-core-tx{font-family:'Space Grotesk',sans-serif;font-size:8.4px;font-weight:700;
  fill:#0D1117;text-anchor:middle}

/* ── 3 · THE LINE ───────────────────────────────────── */
.line-wrap{width:100%;max-width:400px;margin-bottom:20px}
#lineSvg{width:100%;height:auto;display:block;overflow:visible}
.ln-base{stroke:var(--edge);stroke-width:1.4;fill:none}
.ln-run{stroke:url(#runG);stroke-width:2.4;fill:none;stroke-linecap:round;
  stroke-dasharray:340;stroke-dashoffset:340;transition:stroke-dashoffset 2.4s cubic-bezier(.3,.8,.3,1)}
.ln-run.go{stroke-dashoffset:0}
.ln-stop{fill:var(--rail);stroke:var(--edge);stroke-width:1.2;transition:.5s}
.ln-stop.on{fill:var(--gold);stroke:var(--gold)}
.ln-cap{font-family:'Space Grotesk',sans-serif;font-size:7px;fill:var(--dim);text-anchor:middle}
.ln-cap.on{fill:var(--gold)}

.stat-row{display:flex;gap:9px;justify-content:center;margin-top:2px}
.st{background:rgba(14,26,43,.7);border:1px solid var(--edge);border-radius:13px;
  padding:10px 15px;min-width:74px}
.st b{display:block;font-family:var(--mono);font-size:19px;color:var(--gold);line-height:1.15}
.st span{font-size:10px;color:var(--dim)}

/* ── 4 · OWNERSHIP ──────────────────────────────────── */
.book{width:100%;max-width:290px;margin-bottom:18px;
  background:linear-gradient(160deg,rgba(20,34,54,.85),rgba(10,18,32,.7));
  border:1px solid var(--edge);border-radius:16px;padding:15px;text-align:start}
.bk-row{display:flex;align-items:center;gap:9px;padding:7px 0;
  border-bottom:1px solid rgba(148,180,220,.07);opacity:0;transform:translateX(10px);
  transition:opacity .45s,transform .45s}
.bk-row.on{opacity:1;transform:none}
.bk-row:last-child{border-bottom:0}
.bk-en{font-family:var(--en);font-size:14px;font-weight:700;color:var(--ink);direction:ltr}
.bk-ar{font-size:11.5px;color:var(--dim);margin-inline-start:auto}
.bk-mine{font-size:9px;color:var(--teal);border:1px solid rgba(45,212,191,.35);
  border-radius:20px;padding:1px 7px;white-space:nowrap}

/* ── 6 · CTA ────────────────────────────────────────── */
.floor{
  display:flex;align-items:flex-start;gap:11px;max-width:44ch;margin:0 auto;
  background:rgba(45,212,191,.07);border:1px solid rgba(45,212,191,.2);
  border-radius:14px;padding:13px 15px;text-align:start;
}
.floor-ico{font-size:20px;flex:0 0 auto;line-height:1.4}
.floor-tx{font-size:13.5px;color:#A9C9CF;line-height:1.75}
.floor-tx b{color:var(--ink)}
.go-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  text-decoration:none;font-family:var(--en);font-weight:700;font-size:15.5px;
  color:var(--night);background:linear-gradient(100deg,var(--gold),var(--ember));
  border-radius:15px;padding:16px 34px;margin-top:6px;
  box-shadow:0 12px 34px rgba(245,200,66,.22);
  transition:transform .28s cubic-bezier(.34,1.5,.5,1),box-shadow .28s;
}
.go-btn:hover,.go-btn:focus-visible{transform:translateY(-4px);box-shadow:0 20px 44px rgba(245,200,66,.3)}
.credit{margin-top:24px}
.credit .l{font-family:var(--mono);font-size:8.5px;color:var(--dim);letter-spacing:1.6px}
.credit .n{font-family:var(--en);font-size:11.5px;font-weight:700;letter-spacing:3px;color:var(--mist)}

/* ── DECK ───────────────────────────────────────────── */
.nav{
  position:fixed;bottom:0;inset-inline:0;z-index:60;height:var(--deck);
  display:flex;align-items:center;justify-content:center;gap:15px;
  padding:0 18px calc(env(safe-area-inset-bottom,0px) + 4px);
}
.nb{width:48px;height:48px;flex:0 0 48px;border-radius:14px;cursor:pointer;
  background:rgba(20,34,54,.88);border:1px solid var(--edge);color:var(--ink);
  font-size:17px;display:grid;place-items:center;backdrop-filter:blur(10px);
  transition:transform .2s,border-color .25s,opacity .25s}
.nb:hover:not(:disabled),.nb:focus-visible{border-color:var(--gold);transform:translateY(-2px)}
.nb:active:not(:disabled){transform:scale(.93)}
.nb:disabled{opacity:.22;cursor:default}
.nb.go{background:linear-gradient(100deg,var(--gold),var(--ember));border-color:transparent;color:var(--night)}
.nb .ar{display:block}
body.en .nb .ar{transform:scaleX(-1)}
.dots{display:flex;gap:7px}
.dt{width:7px;height:7px;border-radius:50%;background:var(--rail);border:1px solid var(--edge);
  cursor:pointer;padding:0;transition:all .32s cubic-bezier(.4,1.4,.5,1)}
.dt.on{background:var(--gold);border-color:var(--gold);
  box-shadow:0 0 10px rgba(245,200,66,.7);transform:scale(1.32)}
.dt.done{background:rgba(245,200,66,.42);border-color:rgba(245,200,66,.42)}

:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media(max-height:660px){
  .scr{padding-top:64px}
  .stage{height:74px}
  .const-wrap{max-width:270px}
  h1{font-size:24px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .scr > *{opacity:1;transform:none}
  .ln-run{stroke-dashoffset:0}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><i></i>WORDSPARK</div>
  <div class="lang" role="group" aria-label="Language">
    <button id="bAr" class="on" onclick="setLang('ar')">عربي</button>
    <button id="bEn" onclick="setLang('en')">EN</button>
  </div>
</header>

<main class="deck" id="deck">

<!-- 1 · THE SPARK -->
<section class="scr live" data-i="0">
  <div class="stage" aria-hidden="true">
    <span class="sp-w" id="spAr">كلمة</span>
    <span class="sp-b">✦</span>
    <span class="sp-w en" id="spEn">Word</span>
  </div>
  <h1 data-ar="تعلُّم الإنجليزية<br>ليس <span class='spark-tx'>جمع كلمات</span>"
      data-en="Learning English is not<br><span class='spark-tx'>collecting words</span>"></h1>
  <p class="say" data-ar="بل بناء نفسك مهارةً بعد مهارة."
     data-en="It is building yourself, one skill after another."></p>
</section>

<!-- 2 · THE SYSTEM (WOW) -->
<section class="scr" data-i="1">
  <div class="kicker" data-ar="The System · المنظومة" data-en="The System"></div>
  <div class="const-wrap">
    <svg id="constel" viewBox="0 0 300 210" role="img" aria-label="Skills system">
      <defs>
        <radialGradient id="coreG"><stop offset="0%" stop-color="#F5C842"/><stop offset="100%" stop-color="#FB923C"/></radialGradient>
      </defs>
      <g id="cnLines"></g>
      <g id="cnNodes"></g>
      <circle class="cn-core" cx="150" cy="105" r="21"/>
      <text class="cn-core-tx" x="150" y="103">WORD</text>
      <text class="cn-core-tx" x="150" y="112">SPARK</text>
    </svg>
  </div>
  <h1 style="font-size:clamp(21px,5.2vw,31px)"
      data-ar="تسع مهارات <span class='spark-tx'>تنمو معًا</span>"
      data-en="Nine skills that <span class='spark-tx'>grow together</span>"></h1>
  <p class="say" data-ar="ليست تسعة تطبيقات متفرّقة — بل منظومة واحدة، كل جزء فيها يقوّي البقية."
     data-en="Not nine separate apps — one system, where each part strengthens the rest."></p>
</section>

<!-- 3 · THE LINE -->
<section class="scr" data-i="2">
  <div class="kicker" data-ar="The Journey · الرحلة" data-en="The Journey"></div>
  <div class="line-wrap">
    <svg id="lineSvg" viewBox="0 0 360 74" role="img" aria-label="Journey line">
      <defs>
        <linearGradient id="runG" x1="0" x2="1">
          <stop offset="0%" stop-color="#2DD4BF"/><stop offset="55%" stop-color="#F5C842"/><stop offset="100%" stop-color="#FB923C"/>
        </linearGradient>
      </defs>
      <path class="ln-base" d="M14 32 H346"/>
      <path class="ln-run" id="lnRun" d="M14 32 H346"/>
      <g id="lnStops"></g>
    </svg>
  </div>
  <h1 style="font-size:clamp(21px,5.2vw,31px)"
      data-ar="اثنتان وأربعون محطة.<br><span class='spark-tx'>واحدة في كل مرة.</span>"
      data-en="Forty-two stations.<br><span class='spark-tx'>One at a time.</span>"></h1>
  <div class="stat-row">
    <div class="st"><b>42</b><span data-ar="محطة" data-en="stations"></span></div>
    <div class="st"><b>6</b><span data-ar="فصول" data-en="chapters"></span></div>
    <div class="st"><b>15</b><span data-ar="رتبة" data-en="ranks"></span></div>
  </div>
</section>

<!-- 4 · OWNERSHIP -->
<section class="scr" data-i="3">
  <div class="kicker" data-ar="Your Words · قاموسك" data-en="Your Words"></div>
  <div class="book" id="bookCard" aria-hidden="true"></div>
  <h1 style="font-size:clamp(21px,5.2vw,31px)"
      data-ar="قاموسٌ <span class='spark-tx'>بخطّ يدك</span>"
      data-en="A dictionary <span class='spark-tx'>in your own hand</span>"></h1>
  <p class="say" data-ar="القائمة التي بناها غيرك لا تُشعرك بشيء. والتي بنيتَها بيدك تصير ملكك."
     data-en="A list built by someone else means nothing. The one you built becomes yours."></p>
</section>

<!-- 5 · MASTERY -->
<section class="scr" data-i="4">
  <div class="kicker" data-ar="No Dead Ends · لا طريق مسدود" data-en="No Dead Ends"></div>
  <h1 data-ar="لا تخسر شيئًا<br><span class='spark-tx'>إذا لم تنجح</span>"
      data-en="You lose nothing<br><span class='spark-tx'>when you fail</span>"></h1>
  <p class="say" data-ar="تراجع وتعيد بلا حدود. وإن انقطعتَ في منتصف اختبار، تعود إلى نفس السؤال ونفس النقطة. الهدف الإتقان، لا العقاب."
     data-en="Review and retry without limit. Interrupted mid-quiz, you return to the same question at the same point. The goal is mastery, not punishment."></p>

  <!-- The absolute beginner needs to hear this before anything else: the app
       does not assume they can already read. Without this line they judge the
       whole platform by the first station's paragraph and leave. -->
  <div class="floor" style="margin-top:20px">
    <span class="floor-ico">👂</span>
    <span class="floor-tx"
      data-ar="ولا تقرأ حرفًا؟ <b>مختبر الصوت</b> يبدأ معك من الصوت والشكل — تسمع الكلمة، وتميّز <b>b</b> من <b>d</b>، قبل أن تُطالَب بقراءة شيء."
      data-en="Cannot read yet? <b>Sound Lab</b> starts at sound and shape — hear the word, tell <b>b</b> from <b>d</b> — before anything asks you to read."></span>
  </div>
</section>

<!-- 6 · BOARD -->
<section class="scr" data-i="5">
  <div class="kicker" data-ar="Now Boarding · الانطلاق" data-en="Now Boarding"></div>
  <h1 data-ar="القطار <span class='spark-tx'>على الرصيف</span>" data-en="The train is <span class='spark-tx'>at the platform</span>"></h1>
  <p class="say" data-ar="بلا تسجيل، ولا اشتراك، ولا بيانات تُطلب منك."
     data-en="No sign-up, no subscription, no data requested."></p>
  <div>
    <a class="go-btn" href="https://ara2026fat.github.io/WordSpark-/wordspark.html" target="_blank" rel="noopener"
       id="goBtn"><span id="goTx">Start Your Journey</span> <span id="goAr">←</span></a>
    <div class="credit">
      <div class="l">DEVELOPED BY</div>
      <div class="n">ARAFAT ALRAJHI</div>
    </div>
  </div>
</section>

</main>

<nav class="nav" aria-label="Navigation">
  <button class="nb" id="nPrev" onclick="go(-1)" aria-label="Previous"><span class="ar">→</span></button>
  <div class="dots" id="dots"></div>
  <button class="nb go" id="nNext" onclick="go(1)" aria-label="Next"><span class="ar">←</span></button>
</nav>

<div class="sr" role="status" aria-live="polite" id="live"></div>

<script>
(function(){
'use strict';

var scr = Array.prototype.slice.call(document.querySelectorAll('.scr'));
var N = scr.length, at = 0, lang = 'ar';
var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

var TITLES = [
  ['الشرارة','The Spark'], ['المنظومة','The System'], ['الرحلة','The Journey'],
  ['قاموسك','Your Words'], ['الإتقان','Mastery'], ['الانطلاق','Boarding']
];

/* ── The nine skills, wired to one core ─────────────── */
var SKILLS = [
  'VOCAB','READING','LISTENING','SPEAKING','PRONUNCE',
  'SPELLING','GRAMMAR','COMPREHEND','PRACTICE'
];
(function buildConstellation(){
  var lines = '', nodes = '';
  var cx = 150, cy = 105, rx = 118, ry = 76;
  SKILLS.forEach(function(name, i){
    var a = (Math.PI * 2 * i / SKILLS.length) - Math.PI / 2;
    var x = +(cx + Math.cos(a) * rx).toFixed(1);
    var y = +(cy + Math.sin(a) * ry).toFixed(1);
    lines += '<line class="cn-line" data-k="' + i + '" x1="' + cx + '" y1="' + cy + '" x2="' + x + '" y2="' + y + '"/>';
    nodes += '<g class="cn-node" data-k="' + i + '">' +
               '<circle class="cn-dot" cx="' + x + '" cy="' + y + '" r="15"/>' +
               '<text class="cn-tx" x="' + x + '" y="' + (y + 2.6) + '">' + name + '</text>' +
             '</g>';
  });
  document.getElementById('cnLines').innerHTML = lines;
  document.getElementById('cnNodes').innerHTML = nodes;
})();

var constTimer = null;
function runConstellation(on){
  if (constTimer) { clearTimeout(constTimer); constTimer = null; }
  var ls = document.querySelectorAll('.cn-line');
  var ns = document.querySelectorAll('.cn-node');
  if (!on) {
    Array.prototype.forEach.call(ls, function(e){ e.classList.remove('on'); });
    Array.prototype.forEach.call(ns, function(e){ e.classList.remove('on'); });
    return;
  }
  if (reduce) {
    Array.prototype.forEach.call(ls, function(e){ e.classList.add('on'); });
    Array.prototype.forEach.call(ns, function(e){ e.classList.add('on'); });
    return;
  }
  var i = 0;
  (function step(){
    if (i >= ls.length) return;
    ls[i].classList.add('on');
    ns[i].classList.add('on');
    i++;
    constTimer = setTimeout(step, 165);
  })();
}

/* ── The line draws itself ──────────────────────────── */
(function buildLine(){
  var caps = ['MAKKAH','', '', '', '', 'CORONATION'];
  var html = '';
  for (var i = 0; i < 6; i++) {
    var x = 14 + i * (332 / 5);
    html += '<circle class="ln-stop" data-k="' + i + '" cx="' + x.toFixed(1) + '" cy="32" r="5"/>';
    if (caps[i]) html += '<text class="ln-cap" data-k="' + i + '" x="' + x.toFixed(1) + '" y="52">' + caps[i] + '</text>';
  }
  document.getElementById('lnStops').innerHTML = html;
})();

var lineTimer = null;
function runLine(on){
  if (lineTimer) { clearTimeout(lineTimer); lineTimer = null; }
  var run = document.getElementById('lnRun');
  var stops = document.querySelectorAll('.ln-stop');
  var caps = document.querySelectorAll('.ln-cap');
  if (!on) {
    run.classList.remove('go');
    Array.prototype.forEach.call(stops, function(e){ e.classList.remove('on'); });
    Array.prototype.forEach.call(caps, function(e){ e.classList.remove('on'); });
    return;
  }
  if (reduce) {
    run.classList.add('go');
    Array.prototype.forEach.call(stops, function(e){ e.classList.add('on'); });
    Array.prototype.forEach.call(caps, function(e){ e.classList.add('on'); });
    return;
  }
  // Force a reflow so the dash animation restarts on every visit.
  run.classList.remove('go'); void run.getBoundingClientRect();
  run.classList.add('go');
  var i = 0;
  (function step(){
    if (i >= stops.length) return;
    stops[i].classList.add('on');
    var c = document.querySelector('.ln-cap[data-k="' + i + '"]');
    if (c) c.classList.add('on');
    i++;
    lineTimer = setTimeout(step, 400);
  })();
}

/* ── The learner's own dictionary, filling in ───────── */
var BOOK = [
  ['Ambitious','طموح'], ['Discover','يكتشف'], ['Patient','صبور'], ['Knowledge','معرفة']
];
function buildBook(){
  document.getElementById('bookCard').innerHTML = BOOK.map(function(w, i){
    return '<div class="bk-row" data-k="' + i + '">' +
             '<span class="bk-en">' + w[0] + '</span>' +
             '<span class="bk-ar">' + w[1] + '</span>' +
             '<span class="bk-mine">' + (lang === 'ar' ? 'كلمتي' : 'mine') + '</span>' +
           '</div>';
  }).join('');
}
var bookTimer = null;
function runBook(on){
  if (bookTimer) { clearTimeout(bookTimer); bookTimer = null; }
  var rows = document.querySelectorAll('.bk-row');
  if (!on) { Array.prototype.forEach.call(rows, function(r){ r.classList.remove('on'); }); return; }
  if (reduce) { Array.prototype.forEach.call(rows, function(r){ r.classList.add('on'); }); return; }
  var i = 0;
  (function step(){
    if (i >= rows.length) return;
    rows[i].classList.add('on');
    i++;
    bookTimer = setTimeout(step, 300);
  })();
}

/* ── The spark: real vocabulary, igniting ───────────── */
var SPARK = [['كلمة','Word'],['يتعلّم','Learn'],['يكتشف','Discover'],['ينجح','Succeed'],['معرفة','Knowledge']];
var spAt = 0, spTimer = null;
function runSpark(on){
  if (spTimer) { clearInterval(spTimer); spTimer = null; }
  if (!on || reduce) return;
  spTimer = setInterval(function(){
    var a = document.getElementById('spAr'), e = document.getElementById('spEn');
    a.classList.add('out'); e.classList.add('out');
    setTimeout(function(){
      spAt = (spAt + 1) % SPARK.length;
      a.textContent = SPARK[spAt][0];
      e.textContent = SPARK[spAt][1];
      a.classList.remove('out'); e.classList.remove('out');
    }, 420);
  }, 2500);
}

/* ── Language ───────────────────────────────────────── */
function applyLang(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-ar][data-en]'), function(el){
    el.innerHTML = el.getAttribute(lang === 'ar' ? 'data-ar' : 'data-en');
  });
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
  document.body.classList.toggle('en', lang === 'en');
  document.getElementById('bAr').classList.toggle('on', lang === 'ar');
  document.getElementById('bEn').classList.toggle('on', lang === 'en');
  document.getElementById('goTx').textContent = (lang === 'ar') ? 'ابدأ رحلتك' : 'Start Your Journey';
  document.getElementById('goAr').textContent = (lang === 'ar') ? '←' : '→';
  document.getElementById('nPrev').setAttribute('aria-label', lang === 'ar' ? 'السابق' : 'Previous');
  document.getElementById('nNext').setAttribute('aria-label', lang === 'ar' ? 'التالي' : 'Next');
  buildBook();
  if (at === 3) runBook(true);
  announce();
}
window.setLang = function(l){
  if (l === lang) return;
  lang = l;
  try { localStorage.setItem('wsGuideLang', l); } catch(e){}
  applyLang();
};

/* ── Deck ───────────────────────────────────────────── */
(function(){
  var h = '';
  for (var i = 0; i < N; i++) h += '<button class="dt" data-g="' + i + '" aria-label="Screen ' + (i+1) + '"></button>';
  var host = document.getElementById('dots');
  host.innerHTML = h;
  host.addEventListener('click', function(e){
    var d = e.target.closest ? e.target.closest('.dt') : null;
    if (d) jump(parseInt(d.getAttribute('data-g'), 10));
  });
})();

function announce(){
  var t = TITLES[at];
  document.getElementById('live').textContent = (lang === 'ar')
    ? ((at + 1) + ' من ' + N + ' — ' + t[0])
    : ((at + 1) + ' of ' + N + ' — ' + t[1]);
}

function paint(){
  scr.forEach(function(s, i){
    s.classList.toggle('live', i === at);
    s.classList.toggle('past', i < at);
    s.setAttribute('aria-hidden', i === at ? 'false' : 'true');
  });
  Array.prototype.forEach.call(document.querySelectorAll('.dt'), function(d, i){
    d.classList.toggle('on', i === at);
    d.classList.toggle('done', i < at);
  });
  document.getElementById('nPrev').disabled = (at === 0);
  document.getElementById('nNext').disabled = (at === N - 1);

  // Each screen's motion runs only while it is on stage.
  runSpark(at === 0);
  runConstellation(at === 1);
  runLine(at === 2);
  runBook(at === 3);
  announce();
}

function jump(i){
  if (i < 0 || i > N - 1 || i === at) return;
  at = i;
  paint();
}
window.go = function(d){ jump(at + d); };

document.addEventListener('keydown', function(e){
  var f = (lang === 'ar') ? 'ArrowLeft' : 'ArrowRight';
  var b = (lang === 'ar') ? 'ArrowRight' : 'ArrowLeft';
  if (e.key === f || e.key === 'PageDown') { e.preventDefault(); go(1); }
  else if (e.key === b || e.key === 'PageUp') { e.preventDefault(); go(-1); }
  else if (e.key === 'Home') { e.preventDefault(); jump(0); }
  else if (e.key === 'End') { e.preventDefault(); jump(N - 1); }
});

(function(){
  var x0 = null, y0 = null;
  var d = document.getElementById('deck');
  d.addEventListener('touchstart', function(e){
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, { passive: true });
  d.addEventListener('touchend', function(e){
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    var dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 52 && Math.abs(dx) > Math.abs(dy) * 1.6) {
      go(((lang === 'ar') ? (dx > 0) : (dx < 0)) ? 1 : -1);
    }
    x0 = y0 = null;
  }, { passive: true });
})();

try {
  var sv = localStorage.getItem('wsGuideLang');
  if (sv === 'en' || sv === 'ar') lang = sv;
} catch(e){}
applyLang();
paint();
})();
</script>
